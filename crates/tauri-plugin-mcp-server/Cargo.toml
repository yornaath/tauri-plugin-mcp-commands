[package]
name = "tauri-plugin-mcp-server"
description = "Expose selected Tauri commands as an MCP server, safe to ship in release builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
links = "tauri-plugin-mcp-server"

[features]
default = ["specta"]
specta = ["dep:specta", "dep:specta-serde", "tauri/specta"]
# `specta_builder()`: the plugin's commands and types for tauri-specta bindings.
tauri-specta = ["specta", "dep:tauri-specta", "tauri-specta/typescript", "dep:specta-typescript", "tauri/wry"]
# Schema fallback for commands without specta: inputs and results implement `schemars::JsonSchema`.
schemars = ["dep:schemars"]

[dependencies]
tauri-plugin-mcp-server-macros = { path = "../tauri-plugin-mcp-server-macros", version = "0.1.0" }
tauri = { workspace = true }
rmcp = { workspace = true, features = [
    "server",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }
axum = { workspace = true, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["sync", "rt", "net", "time", "macros"] }
tokio-util.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom.workspace = true
base64.workspace = true
http.workspace = true
specta = { workspace = true, optional = true }
specta-serde = { workspace = true, optional = true }
tauri-specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["full"] }
insta.workspace = true
reqwest.workspace = true
trybuild.workspace = true
jsonschema.workspace = true
schemars = { workspace = true, features = ["derive"] }
