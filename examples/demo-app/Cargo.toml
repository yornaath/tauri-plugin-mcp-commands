[package]
name = "demo-app"
description = "Example app for tauri-plugin-mcp-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri-plugin-mcp-server = { path = "../../crates/tauri-plugin-mcp-server" }
tauri = { workspace = true, features = ["default", "tray-icon"] }
specta.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
reqwest = { workspace = true }
